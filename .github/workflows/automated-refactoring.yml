name: automated refactoring

on:
  pull_request: ~
  push: ~
  schedule:
      # Do not make it the first of the month and/or midnight since it is a very busy time
      - cron: '42 10 5 * *'
  workflow_dispatch: ~

jobs:
  automated-refactoring:
    name: automated-refactoring
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, flex

      - name: enable Symfony Flex plugin
        run: composer global config --no-interaction allow-plugins.symfony/flex true

      - name: install composer dependencies
        env:
          SYMFONY_REQUIRE: '6.4.*'
          COMPOSER_PREFER_STABLE: 1
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: "lowest"

      - name: check automated refactorings
        run: vendor/bin/rector --dry-run --ansi
